name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # --ignore-scripts skips the `mate-scripts update` postinstall,
      # which rewrites package.json and has no purpose in CI.
      - run: npm ci --ignore-scripts

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint TypeScript
        run: npx eslint "src/**/*.{ts,tsx}"

      - name: Lint styles
        run: npx stylelint "src/**/*.scss"

      - name: Check formatting
        run: npx prettier --check "./src/**/*.{ts,tsx}"

      - name: Build
        run: npx vite build
